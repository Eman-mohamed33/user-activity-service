apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda
  namespace: user-activity
spec:
  replicas: 1
  selector:
    matchLabels: { app: redpanda }
  template:
    metadata: { labels: { app: redpanda } }
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v24.3.5
          args: [redpanda, start, --overprovisioned, --smp=1, --memory=512M, --reserve-memory=0M, --check=false, --node-id=0, --kafka-addr=internal://0.0.0.0:9092, --advertise-kafka-addr=internal://redpanda:9092]
          ports: [{ containerPort: 9092 }]
          resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { cpu: 500m, memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: user-activity
spec:
  selector: { app: redpanda }
  ports: [{ port: 9092, targetPort: 9092 }]
